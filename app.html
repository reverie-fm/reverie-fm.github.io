<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reverie — App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0a;--surface:#131313;--surface2:#1c1c1c;--surface3:#242424;
  --accent:#c8a96e;--accent2:#e8c98a;--text:#f0ede8;--muted:#7a7a72;
  --border:rgba(200,169,110,.13);--border2:rgba(200,169,110,.28);
  --danger:#e05c5c;--green:#5cba7a;
}
html,body{min-height:100vh}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;overflow-x:hidden}
body.light{--bg:#f5f2ec;--surface:#fffdf8;--surface2:#f0ece3;--surface3:#e8e3d8;
  --text:#1a1714;--muted:#7a7060;--border:rgba(150,120,60,.13);--border2:rgba(150,120,60,.28)}

body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:999;opacity:.025;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}

/* ── Auth Screen ── */
#auth-screen{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;
  background:var(--bg);padding:1.5rem}
.auth-box{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border2);
  border-radius:18px;padding:2.5rem 2rem;text-align:center}
.auth-logo{font-family:'Playfair Display',serif;font-size:1.8rem;color:var(--accent2);margin-bottom:.3rem}
.auth-tagline{font-size:.75rem;color:var(--muted);font-family:'DM Mono',monospace;letter-spacing:.1em;margin-bottom:2rem}
.auth-tabs{display:flex;gap:.5rem;margin-bottom:1.75rem}
.auth-tab{flex:1;padding:.5rem;background:transparent;border:1px solid var(--border);border-radius:8px;
  color:var(--muted);font-family:'DM Sans',sans-serif;font-size:.8rem;cursor:pointer;transition:all .15s}
.auth-tab.active{background:var(--accent);color:#1a1408;border-color:var(--accent);font-weight:700}
.auth-field{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:9px;
  padding:.7rem 1rem;color:var(--text);font-family:'DM Sans',sans-serif;font-size:.9rem;margin-bottom:.75rem;outline:none;transition:border .15s}
.auth-field:focus{border-color:var(--accent)}
.auth-btn{width:100%;padding:.75rem;background:var(--accent);border:none;border-radius:9px;
  color:#1a1408;font-weight:700;font-size:.9rem;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;margin-top:.25rem}
.auth-btn:hover{background:var(--accent2)}
.auth-err{font-size:.78rem;color:var(--danger);margin-top:.6rem;min-height:1.1rem}

/* ── Nav ── */
nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;padding:.75rem 1.5rem;
  background:rgba(10,10,10,.88);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);gap:1rem}
body.light nav{background:rgba(245,242,236,.9)}
.nav-logo{font-family:'Playfair Display',serif;font-size:1.1rem;color:var(--accent2);letter-spacing:-.02em}
.nav-tabs{display:flex;gap:.25rem;margin-left:1rem;flex:1}
.nav-tab{padding:.4rem .9rem;border:none;background:transparent;color:var(--muted);font-family:'DM Sans',sans-serif;
  font-size:.78rem;cursor:pointer;border-radius:7px;transition:all .15s;white-space:nowrap}
.nav-tab:hover{color:var(--text);background:var(--surface2)}
.nav-tab.active{color:var(--accent2);background:var(--surface2)}
.nav-right{display:flex;align-items:center;gap:.75rem;margin-left:auto}
.nav-user{font-family:'DM Mono',monospace;font-size:.7rem;color:var(--accent);padding:.3rem .7rem;
  background:var(--surface2);border-radius:20px;border:1px solid var(--border)}
.nav-icon-btn{padding:.4rem;background:transparent;border:none;color:var(--muted);cursor:pointer;
  border-radius:7px;font-size:1rem;transition:all .15s;display:flex;align-items:center}
.nav-icon-btn:hover{color:var(--text);background:var(--surface2)}

/* ── Layout ── */
.page{display:none;padding-top:4.5rem;min-height:100vh;animation:fadeIn .25s ease}
.page.active{display:block}
.container{max-width:900px;margin:0 auto;padding:2rem 1.5rem}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ── Search ── */
.search-bar{display:flex;gap:.75rem;margin-bottom:1.75rem}
.search-input{flex:1;background:var(--surface);border:1px solid var(--border2);border-radius:10px;
  padding:.75rem 1.1rem;color:var(--text);font-family:'DM Sans',sans-serif;font-size:.92rem;outline:none;transition:border .15s}
.search-input:focus{border-color:var(--accent)}
.search-btn{padding:.75rem 1.4rem;background:var(--accent);border:none;border-radius:10px;
  color:#1a1408;font-weight:700;font-size:.85rem;cursor:pointer;font-family:'DM Sans',sans-serif;white-space:nowrap}
.search-btn:hover{background:var(--accent2)}

/* ── Track Cards ── */
.track-list{display:flex;flex-direction:column;gap:.6rem}
.track-card{display:flex;align-items:center;gap:1rem;padding:.85rem 1.1rem;
  background:var(--surface);border:1px solid var(--border);border-radius:12px;
  transition:border-color .15s,background .15s;cursor:pointer}
.track-card:hover{border-color:var(--border2);background:var(--surface2)}
.track-art{width:48px;height:48px;border-radius:7px;object-fit:cover;flex-shrink:0;background:var(--surface2)}
.track-info{flex:1;min-width:0}
.track-name{font-size:.88rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track-meta{font-size:.73rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track-badge{font-family:'DM Mono',monospace;font-size:.72rem;padding:.25rem .6rem;
  border-radius:20px;flex-shrink:0;background:var(--surface2);color:var(--muted)}
.track-badge.rated{background:rgba(200,169,110,.12);color:var(--accent)}
.track-dur{font-family:'DM Mono',monospace;font-size:.7rem;color:var(--muted);flex-shrink:0}

/* ── Rating Modal ── */
.modal-overlay{position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.65);backdrop-filter:blur(6px);padding:1rem;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:18px;
  padding:2rem;width:100%;max-width:420px;transform:translateY(12px);transition:transform .2s}
.modal-overlay.open .modal{transform:none}
.modal-art{width:80px;height:80px;border-radius:10px;object-fit:cover;margin:0 auto 1rem;display:block}
.modal-title{font-family:'Playfair Display',serif;font-size:1.1rem;color:var(--accent2);text-align:center;margin-bottom:.2rem}
.modal-meta{font-size:.75rem;color:var(--muted);text-align:center;margin-bottom:1.5rem}
.slider-wrap{margin-bottom:1rem}
.slider-label{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem}
.slider-score{font-family:'Playfair Display',serif;font-size:2.5rem;color:var(--accent2);font-weight:700}
.slider-word{font-family:'DM Mono',monospace;font-size:.7rem;color:var(--accent);letter-spacing:.1em}
input[type=range]{width:100%;-webkit-appearance:none;height:5px;border-radius:3px;
  background:linear-gradient(to right,var(--accent) 0%,var(--accent) var(--pct,50%),var(--surface3) var(--pct,50%),var(--surface3) 100%);outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;
  background:var(--accent2);border:3px solid var(--bg);box-shadow:0 2px 8px rgba(0,0,0,.4)}
.modal-note{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:9px;
  padding:.6rem .9rem;color:var(--text);font-family:'DM Sans',sans-serif;font-size:.83rem;outline:none;
  resize:none;margin-bottom:1rem;min-height:60px;transition:border .15s}
.modal-note:focus{border-color:var(--accent)}
.modal-actions{display:flex;gap:.6rem}
.btn-primary{flex:1;padding:.7rem;background:var(--accent);border:none;border-radius:9px;
  color:#1a1408;font-weight:700;font-size:.85rem;cursor:pointer;font-family:'DM Sans',sans-serif;transition:background .15s}
.btn-primary:hover{background:var(--accent2)}
.btn-secondary{padding:.7rem 1.1rem;background:var(--surface2);border:1px solid var(--border);border-radius:9px;
  color:var(--muted);font-size:.85rem;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s}
.btn-secondary:hover{color:var(--text)}
.btn-danger{padding:.7rem 1.1rem;background:rgba(224,92,92,.12);border:1px solid rgba(224,92,92,.25);border-radius:9px;
  color:var(--danger);font-size:.85rem;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s}
.btn-danger:hover{background:rgba(224,92,92,.22)}

/* ── Ratings Page ── */
.sort-bar{display:flex;gap:.5rem;margin-bottom:1.5rem;flex-wrap:wrap;align-items:center}
.sort-btn{padding:.35rem .85rem;background:transparent;border:1px solid var(--border);border-radius:20px;
  color:var(--muted);font-size:.75rem;cursor:pointer;font-family:'DM Mono',monospace;transition:all .15s}
.sort-btn.active,.sort-btn:hover{border-color:var(--accent);color:var(--accent)}
.sort-label{font-size:.7rem;color:var(--muted);font-family:'DM Mono',monospace;margin-right:.25rem}

.rated-card{display:flex;align-items:center;gap:1rem;padding:.85rem 1.1rem;
  background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:.55rem;
  transition:border-color .15s,background .15s;cursor:pointer}
.rated-card:hover{border-color:var(--border2);background:var(--surface2)}
.rated-rank{font-family:'DM Mono',monospace;font-size:.7rem;color:var(--muted);width:24px;flex-shrink:0;text-align:right}
.score-ring{width:46px;height:46px;flex-shrink:0;position:relative}
.score-ring svg{width:46px;height:46px;transform:rotate(-90deg)}
.score-ring circle{fill:none;stroke-width:3.5;stroke-linecap:round}
.score-ring .bg{stroke:var(--surface3)}
.score-ring .fg{stroke:var(--accent);transition:stroke-dashoffset .6s ease}
.score-ring .val{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:'DM Mono',monospace;font-size:.72rem;font-weight:500;color:var(--accent2)}

/* ── Stats ── */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;
  border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:2rem}
.stat-box{padding:1.25rem 1.5rem;background:var(--surface)}
.stat-val{font-family:'Playfair Display',serif;font-size:2rem;color:var(--accent2);font-weight:700;line-height:1}
.stat-label{font-size:.7rem;color:var(--muted);font-family:'DM Mono',monospace;letter-spacing:.08em;margin-top:.3rem}

.dist-bar-wrap{margin-bottom:2rem}
.dist-bar-wrap h3{font-family:'Playfair Display',serif;font-size:1rem;color:var(--accent2);margin-bottom:1rem}
.dist-row{display:flex;align-items:center;gap:.75rem;margin-bottom:.4rem}
.dist-score{font-family:'DM Mono',monospace;font-size:.68rem;color:var(--muted);width:18px;text-align:right;flex-shrink:0}
.dist-bar-bg{flex:1;height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.dist-bar-fg{height:100%;background:var(--accent);border-radius:3px;transition:width .5s ease}
.dist-count{font-family:'DM Mono',monospace;font-size:.68rem;color:var(--muted);width:24px;flex-shrink:0}

/* ── Albums ── */
.albums-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1.25rem}
.album-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;
  cursor:pointer;transition:border-color .2s,transform .2s}
.album-card:hover{border-color:var(--border2);transform:translateY(-3px)}
.album-art-wrap{position:relative;aspect-ratio:1;overflow:hidden;background:var(--surface2)}
.album-art-img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.album-card:hover .album-art-img{transform:scale(1.04)}
.album-vinyl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .25s;background:rgba(0,0,0,.5)}
.album-card:hover .album-vinyl{opacity:1}
.vinyl-svg{width:72px;height:72px;animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.album-info{padding:.9rem 1rem}
.album-name{font-size:.82rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:.2rem}
.album-artist{font-size:.7rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.album-avg{font-family:'DM Mono',monospace;font-size:.7rem;color:var(--accent);margin-top:.4rem}

/* ── Community ── */
.community-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem;margin-bottom:2rem}
.user-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.25rem;
  cursor:pointer;transition:border-color .15s,background .15s}
.user-card:hover{border-color:var(--border2);background:var(--surface2)}
.user-card-top{display:flex;align-items:center;gap:.85rem;margin-bottom:.85rem}
.user-avatar{width:40px;height:40px;border-radius:50%;background:var(--surface3);
  display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;
  font-size:1rem;color:var(--accent2);flex-shrink:0;border:1.5px solid var(--border2)}
.user-name{font-family:'Playfair Display',serif;font-size:.95rem;color:var(--accent2)}
.user-since{font-family:'DM Mono',monospace;font-size:.62rem;color:var(--muted)}
.user-stats{display:flex;gap:1rem}
.user-stat{font-family:'DM Mono',monospace;font-size:.68rem;color:var(--muted)}
.user-stat span{color:var(--accent);font-weight:500}
.follow-btn{margin-top:.75rem;width:100%;padding:.45rem;background:transparent;border:1px solid var(--border2);
  border-radius:8px;color:var(--accent);font-size:.75rem;cursor:pointer;font-family:'DM Mono',monospace;
  transition:all .15s;letter-spacing:.05em}
.follow-btn:hover{background:rgba(200,169,110,.1)}
.follow-btn.following{background:rgba(200,169,110,.12);border-color:var(--accent)}

/* ── Feed ── */
.feed-item{display:flex;align-items:center;gap.85rem;padding:.85rem 1rem;gap:.85rem;
  background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:.5rem}
.feed-art{width:40px;height:40px;border-radius:6px;object-fit:cover;flex-shrink:0;background:var(--surface2)}
.feed-info{flex:1;min-width:0}
.feed-who{font-size:.73rem;color:var(--muted)}.feed-who strong{color:var(--text)}
.feed-track{font-size:.82rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feed-score{font-family:'Playfair Display',serif;font-size:1.3rem;color:var(--accent2);flex-shrink:0;font-weight:700}
.feed-time{font-family:'DM Mono',monospace;font-size:.63rem;color:var(--muted)}

/* ── Profile Modal ── */
.profile-modal{max-width:520px}
.profile-header{display:flex;align-items:center;gap:1.25rem;margin-bottom:1.75rem;padding-bottom:1.25rem;border-bottom:1px solid var(--border)}
.profile-avatar-lg{width:64px;height:64px;border-radius:50%;background:var(--surface3);
  display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;
  font-size:1.7rem;color:var(--accent2);border:2px solid var(--border2);flex-shrink:0}
.profile-name{font-family:'Playfair Display',serif;font-size:1.4rem;color:var(--accent2)}
.profile-sub{font-family:'DM Mono',monospace;font-size:.68rem;color:var(--muted);margin-top:.2rem}

/* ── Settings ── */
.settings-section{margin-bottom:1.75rem;padding-bottom:1.75rem;border-bottom:1px solid var(--border)}
.settings-section:last-child{border:none}
.settings-title{font-family:'Playfair Display',serif;font-size:1rem;color:var(--accent2);margin-bottom:1rem}
.settings-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:.75rem}
.settings-label{font-size:.83rem;color:var(--text)}
.toggle{width:40px;height:22px;background:var(--surface3);border-radius:11px;cursor:pointer;
  position:relative;transition:background .2s;border:none}
.toggle.on{background:var(--accent)}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;
  background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.toggle.on::after{transform:translateX(18px)}

/* ── Toast ── */
.toast{position:fixed;bottom:2rem;right:2rem;z-index:2000;background:var(--surface2);
  border:1px solid var(--border2);border-radius:10px;padding:.7rem 1.2rem;
  font-size:.8rem;color:var(--text);pointer-events:none;opacity:0;transform:translateY(8px);
  transition:all .25s;max-width:280px}
.toast.show{opacity:1;transform:none}
.toast.success{border-color:rgba(92,186,122,.4);color:var(--green)}
.toast.error{border-color:rgba(224,92,92,.4);color:var(--danger)}

/* ── Empty ── */
.empty{text-align:center;padding:4rem 2rem;color:var(--muted)}
.empty-icon{font-size:2.5rem;margin-bottom:.75rem;opacity:.4}
.empty-msg{font-size:.85rem;line-height:1.7}

.page-title{font-family:'Playfair Display',serif;font-size:1.5rem;color:var(--accent2);margin-bottom:.25rem}
.page-sub{font-size:.78rem;color:var(--muted);margin-bottom:1.75rem}

.loading{display:flex;align-items:center;justify-content:center;padding:3rem;color:var(--muted);
  font-family:'DM Mono',monospace;font-size:.75rem;gap:.5rem}
.spinner{width:16px;height:16px;border:2px solid var(--border2);border-top-color:var(--accent);
  border-radius:50%;animation:spin .6s linear infinite;flex-shrink:0}
</style>
</head>
<body>

<!-- Auth Screen -->
<div id="auth-screen">
  <div class="auth-box">
    <div class="auth-logo">Reverie</div>
    <div class="auth-tagline">Personal Music Rankings</div>
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchAuthTab('login')">Sign In</button>
      <button class="auth-tab" onclick="switchAuthTab('signup')">Sign Up</button>
    </div>
    <input class="auth-field" id="auth-email" type="email" placeholder="Email">
    <input class="auth-field" id="auth-username" type="text" placeholder="Username" style="display:none">
    <input class="auth-field" id="auth-pass" type="password" placeholder="Password">
    <button class="auth-btn" onclick="doAuth()">Continue</button>
    <div class="auth-err" id="auth-err"></div>
  </div>
</div>

<!-- Nav -->
<nav id="main-nav" style="display:none">
  <div class="nav-logo">Reverie</div>
  <div class="nav-tabs">
    <button class="nav-tab active" onclick="showPage('search')">Search</button>
    <button class="nav-tab" onclick="showPage('ratings')">My Ratings</button>
    <button class="nav-tab" onclick="showPage('albums')">Albums</button>
    <button class="nav-tab" onclick="showPage('stats')">Stats</button>
    <button class="nav-tab" onclick="showPage('community')">Community</button>
  </div>
  <div class="nav-right">
    <span class="nav-user" id="nav-username">—</span>
    <button class="nav-icon-btn" onclick="showPage('settings')" title="Settings">⚙</button>
    <button class="nav-icon-btn" onclick="signOut()" title="Sign Out">↩</button>
  </div>
</nav>

<!-- Pages -->
<div id="page-search" class="page active">
  <div class="container">
    <div class="page-title">Search</div>
    <div class="page-sub">Find any track and rate it</div>
    <div class="search-bar">
      <input class="search-input" id="search-q" placeholder="Song name, artist…" onkeydown="if(event.key==='Enter')doSearch()">
      <button class="search-btn" onclick="doSearch()">Search</button>
    </div>
    <div id="search-results"></div>
  </div>
</div>

<div id="page-ratings" class="page">
  <div class="container">
    <div class="page-title">My Ratings</div>
    <div class="page-sub">Everything you've scored so far</div>
    <div class="sort-bar">
      <span class="sort-label">Sort:</span>
      <button class="sort-btn active" onclick="setSortRatings('score',this)">Score ↓</button>
      <button class="sort-btn" onclick="setSortRatings('date',this)">Recent</button>
      <button class="sort-btn" onclick="setSortRatings('name',this)">A–Z</button>
    </div>
    <div id="ratings-list"></div>
  </div>
</div>

<div id="page-albums" class="page">
  <div class="container">
    <div class="page-title">Albums</div>
    <div class="page-sub">Your rated tracks grouped by album</div>
    <div id="albums-grid" class="albums-grid"></div>
  </div>
</div>

<div id="page-stats" class="page">
  <div class="container">
    <div class="page-title">Stats</div>
    <div class="page-sub">Your listening in numbers</div>
    <div id="stats-content"></div>
  </div>
</div>

<div id="page-community" class="page">
  <div class="container">
    <div class="page-title">Community</div>

<script>

const SUPABASE_URL = 'https://zqlutjvsmtktwizhzjms.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpxbHV0anZzbXRrdHdpemh6am1zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzOTUwMDAsImV4cCI6MjA5Mzk3MTAwMH0.rMvkjTzmmi1T0MCXnyAGA6Cw-CO4ZK6vfgNBVPKJj1I';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON);

// Spotify token
const SPOTIFY_CLIENT_ID = '93d396e1aaae4b618b6a3d89d2d47a78';
const SPOTIFY_CLIENT_SECRET = '9e95e43840d64d6f9b1f1e8f0e9e6a62';
let spotifyToken = null, spotifyTokenExp = 0;

// App state
let currentUser = null;
let myProfile = null;

// ═══════════════════════════════════════════════
//  AUTH
// ═══════════════════════════════════════════════
let authMode = 'login';

function switchAuthTab(mode) {
  authMode = mode;
  document.querySelectorAll('.auth-tab').forEach((t,i) => t.classList.toggle('active', (i===0 && mode==='login')||(i===1 && mode==='signup')));
  document.getElementById('auth-username').style.display = mode === 'signup' ? 'block' : 'none';
  document.getElementById('auth-err').textContent = '';
}

async function doAuth() {
  const email = document.getElementById('auth-email').value.trim();
  const pass  = document.getElementById('auth-pass').value;
  const errEl = document.getElementById('auth-err');
  errEl.textContent = '';
  if (!email || !pass) { errEl.textContent = 'Please fill in all fields.'; return; }

  if (authMode === 'signup') {
    const username = document.getElementById('auth-username').value.trim();
    if (!username) { errEl.textContent = 'Choose a username.'; return; }
    if (username.length < 3) { errEl.textContent = 'Username must be 3+ characters.'; return; }
    // Check username taken
    const {data: existing} = await sb.from('profiles').select('id').eq('username', username).maybeSingle();
    if (existing) { errEl.textContent = 'Username already taken.'; return; }
    const {data, error} = await sb.auth.signUp({email, password: pass, options:{data:{username}}});
    if (error) { errEl.textContent = error.message; return; }
    toast('Check your email to confirm your account!');
  } else {
    const {data, error} = await sb.auth.signInWithPassword({email, password: pass});
    if (error) { errEl.textContent = error.message; return; }
  }
}

async function signOut() {
  await sb.auth.signOut();
  currentUser = null; myProfile = null; myRatings = []; followIds = new Set();
  document.getElementById('main-nav').style.display = 'none';
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-search').classList.add('active');

}

// ═══════════════════════════════════════════════
//  SESSION LISTENER
// ═══════════════════════════════════════════════
sb.auth.onAuthStateChange(async (event, session) => {

    currentUser = session.user;

}

async function loadMyRatings() {

  myRatings = data || [];
}

async function loadFollows() {

// ═══════════════════════════════════════════════
//  NAV / PAGES

function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  const tabs = {search:0,ratings:1,albums:2,stats:3,community:4};
  if (tabs[name] !== undefined) document.querySelectorAll('.nav-tab')[tabs[name]].classList.add('active');
  if (name === 'community') renderCommunity();
  if (name === 'settings') renderSettings();

// ═══════════════════════════════════════════════
//  SPOTIFY
// ═══════════════════════════════════════════════
async function getSpotifyToken() {
  if (spotifyToken && Date.now() < spotifyTokenExp) return spotifyToken;
  const r = await fetch('https://accounts.spotify.com/api/token', {
    method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded',
      Authorization:'Basic ' + btoa(SPOTIFY_CLIENT_ID + ':' + SPOTIFY_CLIENT_SECRET)},
    body:'grant_type=client_credentials'});
  const d = await r.json();
  spotifyToken = d.access_token;
  spotifyTokenExp = Date.now() + (d.expires_in - 30) * 1000;
  return spotifyToken;
}

async function doSearch() {
  const q = document.getElementById('search-q').value.trim();
  if (!q) return;
  const el = document.getElementById('search-results');
  el.innerHTML = '<div class="loading"><div class="spinner"></div> Searching…</div>';
  try {
    const token = await getSpotifyToken();
    const r = await fetch(`https://api.spotify.com/v1/search?q=${encodeURIComponent(q)}&type=track&limit=20`, {headers:{Authorization:'Bearer '+token}});
    const d = await r.json();
    const tracks = d.tracks?.items || [];
    if (!tracks.length) { el.innerHTML = '<div class="empty"><div class="empty-icon">🎵</div><div class="empty-msg">No results found</div></div>'; return; }
    el.innerHTML = '<div class="track-list">' + tracks.map(t => {
      const art = t.album?.images?.[2]?.url || t.album?.images?.[0]?.url || '';
      const rated = myRatings.find(r => r.spotify_id === t.id);
      const dur = msToMin(t.duration_ms);
      return `<div class="track-card" onclick='openModal(${JSON.stringify(t)})'>
        <img class="track-art" src="${art}" loading="lazy">
        <div class="track-info">
          <div class="track-name">${esc(t.name)}</div>
          <div class="track-meta">${esc(t.artists.map(a=>a.name).join(', '))} · ${esc(t.album.name)}</div>
        </div>
        <div class="track-dur">${dur}</div>
        ${rated ? `<div class="track-badge rated">${rated.score}</div>` : '<div class="track-badge">Rate</div>'}
      </div>`;
    }).join('') + '</div>';
  } catch(e) { el.innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-msg">Search failed. Try again.</div></div>'; }
}

// ═══════════════════════════════════════════════
//  RATING MODAL
// ═══════════════════════════════════════════════
const scoreWords = [,'SKIP','BAD','MEH','MEH','DECENT','DECENT','GOOD','GREAT','EXCELLENT','MASTERPIECE','MASTERPIECE'];

function openModal(track) {
  currentTrack = track;
  const art = track.album?.images?.[1]?.url || track.album?.images?.[0]?.url || '';
  document.getElementById('m-art').src = art;
  document.getElementById('m-title').textContent = track.name;
  document.getElementById('m-meta').textContent = track.artists.map(a=>a.name).join(', ') + ' · ' + track.album.name;
  const existing = myRatings.find(r => r.spotify_id === track.id);
  const score = existing ? existing.score : 5;
  document.getElementById('m-slider').value = score;
  document.getElementById('m-note').value = existing?.note || '';
  document.getElementById('m-delete-btn').style.display = existing ? 'block' : 'none';
  updateSlider(document.getElementById('m-slider'));
  document.getElementById('rating-modal').classList.add('open');
}

function closeModal() { document.getElementById('rating-modal').classList.remove('open'); currentTrack = null; }

function updateSlider(el) {
  const v = parseFloat(el.value);
  document.getElementById('m-score').textContent = v.toFixed(1);
  document.getElementById('m-word').textContent = scoreWords[Math.round(v)] || '';
  const pct = ((v - 1) / 9 * 100).toFixed(1);
  el.style.setProperty('--pct', pct + '%');
}

async function saveRating() {
  if (!currentTrack) return;
  const score = parseFloat(document.getElementById('m-slider').value);
  const note  = document.getElementById('m-note').value.trim();
  const track = currentTrack;
  const art   = track.album?.images?.[1]?.url || track.album?.images?.[0]?.url || '';

  const payload = {
    user_id: currentUser.id,
    spotify_id: track.id,
    track_name: track.name,
    artist_name: track.artists.map(a=>a.name).join(', '),
    album_name: track.album.name,
    album_art: art,
    duration_ms: track.duration_ms,
    score,
    note: note || null,
    rated_at: new Date().toISOString()
  };

  const {error} = await sb.from('ratings').upsert(payload, {onConflict:'user_id,spotify_id'});
  if (error) { toast('Error saving: ' + error.message, 'error'); return; }

  // Update local
  const idx = myRatings.findIndex(r => r.spotify_id === track.id);
  if (idx >= 0) myRatings[idx] = {...myRatings[idx], ...payload};
  else myRatings.unshift(payload);

  closeModal();
  toast('Rating saved!', 'success');
  renderRatingsPage();
  renderAlbumsPage();
  renderStatsPage();
}

async function deleteRating() {
  if (!currentTrack) return;
  const {error} = await sb.from('ratings').delete().eq('user_id', currentUser.id).eq('spotify_id', currentTrack.id);
  if (error) { toast('Error: ' + error.message, 'error'); return; }
  myRatings = myRatings.filter(r => r.spotify_id !== currentTrack.id);
  closeModal();
  toast('Rating removed.');
  renderRatingsPage();
  renderAlbumsPage();
  renderStatsPage();
}

// ═══════════════════════════════════════════════
//  RATINGS PAGE
// ═══════════════════════════════════════════════
function setSortRatings(s, btn) {
  ratingsSort = s;
  document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderRatingsPage();
}

function renderRatingsPage() {
  const el = document.getElementById('ratings-list');
  if (!myRatings.length) { el.innerHTML = '<div class="empty"><div class="empty-icon">⭐</div><div class="empty-msg">You haven\'t rated anything yet.<br>Go to Search to get started.</div></div>'; return; }
  let sorted = [...myRatings];
  if (ratingsSort === 'score') sorted.sort((a,b) => b.score - a.score);
  else if (ratingsSort === 'date') sorted.sort((a,b) => new Date(b.rated_at) - new Date(a.rated_at));
  else sorted.sort((a,b) => a.track_name.localeCompare(b.track_name));
  el.innerHTML = sorted.map((r, i) => `
    <div class="rated-card" onclick='openModal({id:"${r.spotify_id}",name:${JSON.stringify(r.track_name)},artists:[{name:${JSON.stringify(r.artist_name)}}],album:{name:${JSON.stringify(r.album_name)},images:[{url:${JSON.stringify(r.album_art)}}]},duration_ms:${r.duration_ms||0}})'>
      <div class="rated-rank">#${i+1}</div>
      <div class="score-ring">${scoreRing(r.score)}</div>
      <img class="track-art" src="${r.album_art||''}" loading="lazy">
      <div class="track-info">
        <div class="track-name">${esc(r.track_name)}</div>
        <div class="track-meta">${esc(r.artist_name)} · ${esc(r.album_name)}</div>
        ${r.note ? `<div class="track-meta" style="color:var(--accent);opacity:.7;font-style:italic">"${esc(r.note)}"</div>` : ''}
      </div>
      <div class="track-dur">${timeAgo(r.rated_at)}</div>
    </div>`).join('');
}

// ═══════════════════════════════════════════════
//  ALBUMS PAGE
// ═══════════════════════════════════════════════
function renderAlbumsPage() {
  const el = document.getElementById('albums-grid');
  if (!myRatings.length) { el.innerHTML = '<div class="empty"><div class="empty-icon">💿</div><div class="empty-msg">No albums yet.</div></div>'; return; }
  const albums = {};
  myRatings.forEach(r => {
    if (!albums[r.album_name]) albums[r.album_name] = {name:r.album_name, artist:r.artist_name, art:r.album_art, tracks:[]};
    albums[r.album_name].tracks.push(r);
  });
  el.innerHTML = Object.values(albums).map(alb => {
    const avg = (alb.tracks.reduce((s,t) => s+t.score,0)/alb.tracks.length).toFixed(1);
    return `<div class="album-card">
      <div class="album-art-wrap">
        <img class="album-art-img" src="${alb.art||''}">
        <div class="album-vinyl">${vinylSVG()}</div>
      </div>
      <div class="album-info">
        <div class="album-name">${esc(alb.name)}</div>
        <div class="album-artist">${esc(alb.artist)}</div>
        <div class="album-avg">Avg ${avg} · ${alb.tracks.length} track${alb.tracks.length!==1?'s':''}</div>
      </div>
    </div>`;
  }).join('');
}

// ═══════════════════════════════════════════════
//  STATS PAGE
// ═══════════════════════════════════════════════
function renderStatsPage() {
  const el = document.getElementById('stats-content');
  if (!myRatings.length) { el.innerHTML = '<div class="empty"><div class="empty-icon">📊</div><div class="empty-msg">Rate some tracks to see stats.</div></div>'; return; }
  const avg = (myRatings.reduce((s,r)=>s+r.score,0)/myRatings.length).toFixed(2);
  const artists = {};
  myRatings.forEach(r => {
    const a = r.artist_name.split(',')[0].trim();
    if (!artists[a]) artists[a] = {count:0, total:0};
    artists[a].count++; artists[a].total += r.score;
  });
  const topArtist = Object.entries(artists).sort((a,b)=>b[1].count-a[1].count)[0];
  const dist = {};
  for (let i=1;i<=10;i++) dist[i] = 0;
  myRatings.forEach(r => { const k = Math.round(r.score); dist[k] = (dist[k]||0)+1; });
  const maxD = Math.max(...Object.values(dist));
  el.innerHTML = `
    <div class="stats-grid">
      <div class="stat-box"><div class="stat-val">${myRatings.length}</div><div class="stat-label">RATED</div></div>
      <div class="stat-box"><div class="stat-val">${avg}</div><div class="stat-label">AVG SCORE</div></div>
      <div class="stat-box"><div class="stat-val">${Object.keys(artists).length}</div><div class="stat-label">ARTISTS</div></div>
      <div class="stat-box"><div class="stat-val">${topArtist?topArtist[0]:'—'}</div><div class="stat-label">TOP ARTIST</div></div>
    </div>
    <div class="dist-bar-wrap">
      <h3>Score Distribution</h3>
      ${Object.entries(dist).sort((a,b)=>b[0]-a[0]).map(([sc,cnt])=>`
        <div class="dist-row">
          <div class="dist-score">${sc}</div>
          <div class="dist-bar-bg"><div class="dist-bar-fg" style="width:${maxD?cnt/maxD*100:0}%"></div></div>
          <div class="dist-count">${cnt}</div>
        </div>`).join('')}
    </div>`;
}

// ═══════════════════════════════════════════════
//  COMMUNITY
// ═══════════════════════════════════════════════
async function renderCommunity() {
  const el = document.getElementById('community-content');
  el.innerHTML = '<div class="loading"><div class="spinner"></div> Loading…</div>';

  // Load all profiles + their rating count
  const {data: profiles} = await sb.from('profiles').select('*').neq('id', currentUser.id).order('created_at',{ascending:false});
  
  // Load recent global ratings for feed
  const {data: feed} = await sb.from('ratings').select('*, profiles(username)').order('rated_at',{ascending:false}).limit(30);

  const cards = (profiles||[]).map(p => {
    const isFollowing = followIds.has(p.id);
    return `<div class="user-card">
      <div class="user-card-top">
        <div class="user-avatar">${p.username[0].toUpperCase()}</div>
        <div>
          <div class="user-name">${esc(p.username)}</div>
          <div class="user-since">joined ${timeAgo(p.created_at)}</div>
        </div>
      </div>
      <button class="follow-btn ${isFollowing?'following':''}" onclick="toggleFollow('${p.id}',this)">${isFollowing?'✓ Following':'+ Follow'}</button>
      <button class="sort-btn" style="margin-top:.5rem;width:100%;border-radius:8px" onclick='viewProfile("${p.id}","${esc(p.username)}")'>View Profile</button>
    </div>`;
  }).join('');

  const feedHtml = (feed||[]).map(r => `
    <div class="feed-item">
      <img class="feed-art" src="${r.album_art||''}" loading="lazy">
      <div class="feed-info">
        <div class="feed-who"><strong>${esc(r.profiles?.username||'?')}</strong> rated</div>
        <div class="feed-track">${esc(r.track_name)} · <span style="color:var(--muted);font-size:.75rem">${esc(r.artist_name)}</span></div>
        <div class="feed-time">${timeAgo(r.rated_at)}</div>
      </div>
      <div class="feed-score">${r.score}</div>
    </div>`).join('');

  el.innerHTML = `
    <div class="page-sub" style="margin-bottom:1rem;font-family:'DM Mono',monospace;font-size:.65rem;text-transform:uppercase;letter-spacing:.1em;color:var(--accent)">Members</div>
    <div class="community-grid">${cards || '<div class="empty" style="grid-column:1/-1"><div class="empty-msg">No other members yet.</div></div>'}</div>
    <div class="page-sub" style="margin-bottom:1rem;margin-top:1.5rem;font-family:'DM Mono',monospace;font-size:.65rem;text-transform:uppercase;letter-spacing:.1em;color:var(--accent)">Global Feed</div>
    ${feedHtml || '<div class="empty"><div class="empty-msg">No ratings yet.</div></div>'}`;
}

async function toggleFollow(userId, btn) {
  if (followIds.has(userId)) {
    await sb.from('follows').delete().eq('follower_id', currentUser.id).eq('following_id', userId);
    followIds.delete(userId);
    btn.textContent = '+ Follow';
    btn.classList.remove('following');
  } else {
    await sb.from('follows').insert({follower_id: currentUser.id, following_id: userId});
    followIds.add(userId);
    btn.textContent = '✓ Following';
    btn.classList.add('following');
  }
}

async function viewProfile(userId, username) {
  const modal = document.getElementById('profile-modal');
  const content = document.getElementById('profile-modal-content');
  content.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  modal.classList.add('open');

  const {data: ratings} = await sb.from('ratings').select('*').eq('user_id', userId).order('score',{ascending:false}).limit(50);
  const rs = ratings || [];
  const avg = rs.length ? (rs.reduce((s,r)=>s+r.score,0)/rs.length).toFixed(2) : '—';
  const top5 = rs.slice(0,5);

  content.innerHTML = `
    <div class="profile-header">
      <div class="profile-avatar-lg">${username[0].toUpperCase()}</div>
      <div>
        <div class="profile-name">${esc(username)}</div>
        <div class="profile-sub">${rs.length} ratings · avg ${avg}</div>
      </div>
    </div>
    <div style="font-family:'DM Mono',monospace;font-size:.65rem;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);margin-bottom:.75rem">Top Rated</div>
    ${top5.map((r,i) => `<div class="rated-card" style="margin-bottom:.4rem;cursor:default">
      <div class="rated-rank">#${i+1}</div>
      <div class="score-ring">${scoreRing(r.score)}</div>
      <img class="track-art" src="${r.album_art||''}">
      <div class="track-info">
        <div class="track-name">${esc(r.track_name)}</div>
        <div class="track-meta">${esc(r.artist_name)}</div>
      </div>
    </div>`).join('') || '<div class="empty"><div class="empty-msg">No ratings yet.</div></div>'}`;
}

function closeProfileModal() { document.getElementById('profile-modal').classList.remove('open'); }

    </div>
    <div class="settings-section">
      <div class="settings-title">Change Username</div>

      <button class="btn-primary" onclick="changePassword()" style="margin-top:.75rem">Update Password</button>
    </div>
    <div class="settings-section">
      <div class="settings-title">Appearance</div>
      <div class="settings-row">
        <span class="settings-label">Light mode</span>
        <button class="toggle ${isLight?'on':''}" id="light-toggle" onclick="toggleLight(this)"></button>
      </div>
    </div>
    ${myProfile?.username === adminUsername ? `
    <div class="settings-section">
      <div class="settings-title" style="color:var(--danger)">Admin</div>
      <button class="btn-danger" onclick="loadAdminPanel()">Manage Users</button>
      <div id="admin-panel"></div>
    </div>` : ''}`;
}

async function changeUsername() {
  const val = document.getElementById('new-username').value.trim();
  if (!val || val.length < 3) { toast('Username must be 3+ characters.', 'error'); return; }
  const {data: existing} = await sb.from('profiles').select('id').eq('username', val).maybeSingle();
  if (existing) { toast('Username taken.', 'error'); return; }
  const {error} = await sb.from('profiles').update({username: val}).eq('id', currentUser.id);
  if (error) { toast(error.message, 'error'); return; }
  myProfile.username = val;
  document.getElementById('nav-username').textContent = val;
  toast('Username updated!', 'success');
  renderSettings();
}

async function changePassword() {
  const pass = document.getElementById('new-pass').value;
  if (!pass || pass.length < 6) { toast('Password must be 6+ characters.', 'error'); return; }
  const {error} = await sb.auth.updateUser({password: pass});
  if (error) { toast(error.message, 'error'); return; }
  toast('Password updated!', 'success');
}

function toggleLight(btn) {
  document.body.classList.toggle('light');
  btn.classList.toggle('on');
  localStorage.setItem('rv-light', document.body.classList.contains('light') ? '1' : '0');
}

async function loadAdminPanel() {
  const el = document.getElementById('admin-panel');
  el.innerHTML = '<div class="loading" style="justify-content:flex-start;padding:1rem 0"><div class="spinner"></div></div>';
  const {data} = await sb.from('profiles').select('*').order('created_at',{ascending:false});
  el.innerHTML = '<div style="margin-top:1rem">' + (data||[]).map(p => `
    <div style="display:flex;align-items:center;gap:.75rem;padding:.6rem 0;border-bottom:1px solid var(--border)">
      <div style="flex:1;font-size:.83rem">${esc(p.username)}</div>
      <div style="font-size:.7rem;color:var(--muted)">${esc(p.id.slice(0,8))}…</div>
      <button class="sort-btn" onclick="adminEditUser('${p.id}','${esc(p.username)}')">Edit</button>
    </div>`).join('') + '</div>';
}

async function adminEditUser(uid, uname) {
  const newName = prompt(`New username for ${uname}:`, uname);
  if (!newName || newName === uname) return;
  const {error} = await sb.from('profiles').update({username: newName}).eq('id', uid);
  if (error) { toast(error.message, 'error'); return; }
  toast('Updated!', 'success');
  loadAdminPanel();
}

// ═══════════════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════════════
function scoreRing(score) {
  const r = 19, c = 2*Math.PI*r, pct = (score-1)/9, dash = pct*c;
  const color = score >= 8 ? '#5cba7a' : score >= 5 ? 'var(--accent)' : '#e05c5c';
  return `<svg viewBox="0 0 46 46"><circle class="bg" cx="23" cy="23" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="0"/>
    <circle class="fg" cx="23" cy="23" r="${r}" stroke="${color}" stroke-dasharray="${c}" stroke-dashoffset="${c-dash}"/></svg>
    <div class="val">${score}</div>`;
}

function vinylSVG() {
  return `<svg class="vinyl-svg" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
    <circle cx="36" cy="36" r="35" fill="#111"/><circle cx="36" cy="36" r="28" fill="none" stroke="#333" stroke-width="1"/>
    <circle cx="36" cy="36" r="20" fill="none" stroke="#333" stroke-width="1"/><circle cx="36" cy="36" r="12" fill="none" stroke="#333" stroke-width="1"/>
    <circle cx="36" cy="36" r="5" fill="var(--accent)"/><circle cx="36" cy="36" r="2" fill="#111"/></svg>`;
}

function msToMin(ms) { if (!ms) return '—'; const t = Math.round(ms/1000); return `${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`; }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function timeAgo(ts) {
  if (!ts) return '';
  const s = Math.round((Date.now() - new Date(ts))/1000);
  if (s<60) return 'just now';
  if (s<3600) return `${Math.floor(s/60)}m ago`;
  if (s<86400) return `${Math.floor(s/3600)}h ago`;
  if (s<604800) return `${Math.floor(s/86400)}d ago`;
  return new Date(ts).toLocaleDateString();
}

let toastTimer;
function toast(msg, type='') {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = 'toast ' + type + ' show';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}

// Close modals on overlay click
document.getElementById('rating-modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });
document.getElementById('profile-modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeProfileModal(); });

// Restore light mode preference
if (localStorage.getItem('rv-light') === '1') document.body.classList.add('light');
</script>
</body>
